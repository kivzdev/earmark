[project]
name = "earmark"
version = "0.1.0"
description = "Watches Twitch with you and keeps the everyday English you hear, with the clip it was said in."
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# Apple Silicon: NVIDIA Parakeet on MLX (fast, accurate English, word timings)
mlx = ["parakeet-mlx>=0.6"]
# Windows, Linux, Intel Macs: Whisper through CTranslate2
whisper = ["faster-whisper>=1.1"]

[project.scripts]
earmark = "earmark.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["earmark"]
